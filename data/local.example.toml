# Copy to data/local.toml (git-ignored) and edit. Use single-quoted literal strings:
# Windows backslashes are escapes inside double quotes. Relative paths resolve against
# the repository root. Each key can be overridden by an environment variable:
#   vanilla_rom -> NUZLINE_VANILLA_ROM    kaizo_patch -> NUZLINE_KAIZO_PATCH
#   pkcalc_zip  -> NUZLINE_PKCALC_ZIP     kaizo_docs  -> NUZLINE_KAIZO_DOCS
#   kaizo_save  -> NUZLINE_KAIZO_SAVE
#   kaizo_save_pre_roark -> NUZLINE_KAIZO_SAVE_PRE_ROARK  (.sav or DeSmuME .dsv)
#   kaizo_save_probe -> NUZLINE_KAIZO_SAVE_PROBE  (the trace probe's DeSmuME .dsv)
# Only vanilla_rom is required.
vanilla_rom = 'C:\roms\Pokemon - Platinum Version (U).nds'
kaizo_patch = 'C:\roms\Pokemon Platinum Kaizo Nightmare Update Final.xdelta'
pkcalc_zip = 'C:\roms\PKCalc-main.zip'
kaizo_docs = 'C:\roms\Platinum Kaizo Docs.xlsx'
kaizo_save = 'C:\roms\Platinum Kaizo Nightmare.sav'
kaizo_save_pre_roark = 'C:\roms\Platinum Kaizo Base.dsv'
kaizo_save_probe = 'C:\roms\Battery\Kaizo Probe.dsv'

# Nuzlocke rules for `nuzline prep` (docs/gauntlet-design.md section 3). Optional; the
# ROM tools ignore this table. Values below are the strictest, which are also the
# defaults when the table or a key is absent.
[run]
deaths_scope = "chain"                  # or "fight"
cap_overflow = "sit_out_after_fight"    # or "fight"
cap_sit_out_in_party = "forbidden"      # or "allowed"
revived_dead = "stay_dead"              # or "revived"
shedinja = "forbidden"                  # or "allowed"
field_poison = "worst_case"             # or "ignore"
