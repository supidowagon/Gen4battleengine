# RESTAURANT, changed by the patch, still reached from its header entries) runs
# StartTrainerBattle on vanilla's nine restaurant pairs (535-552), while the patched event
# files also place these ids on the Galactic HQ maps with no scripted pair (PKCalc and the
# sheet pair them differently there: HQ sight pairs, one-trainer doubles or singles).

[fields.539]
format = "unknown"
