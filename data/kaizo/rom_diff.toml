note = "decoded: three unused script commands point into the injected code at 0x023C8000: 0x3F ScrCmd_Unused_03F -> 0x023C85C5 (party[VAR_0x8004] status := VAR_0x8005 when it has none), 0x9C ScrCmd_Unused_09C -> 0x023C8345 (VAR_0x4015 == 0: load wild encounters from NARC 161 member VAR_0x4016; else FieldOverworldState_SetWeather(VAR_0x4016), then ov5_021D5F7C(field weather, VAR_0x4016) when VAR_0x4017 != 0), 0x1CE ScrCmd_Unused_1CE -> 0x023C83DF (every party mon's exp := one below its next level, then CalcLevelAndStats); src/scrcmd.c:764; include/data/scripts/scrcmd.h:71,164,470; rom:scr_seq.narc (K1 walk of every Kaizo script file). Weather: the overworld weather is the battle's fieldWeather (src/field_battle_data_transfer.c:267) and is reset from the header on every map change (src/field_map_change.c:273-280); 0x9C sets it only in map-local files 182 (header 172, weather 18), 329 (header 293, 4), 459 (header 373, 4) and 1056 (header 415, 16); file 1117 (header 35) uses only the wild branch. Status: 0x3F runs in map-local files 278 (header 257, entry 1, whole party asleep) and 363 (header 321, before its StartFirstBattle) and in common script 9019 (scr_seq 213 entry 20), which the events of headers 104, 113, 130, 148, 158, 160, 216, 301, 302, 306, 348, 384, 415, 440 and 514 reference; the status stays on the party Pokemon, so it also carries to a later fight on any other map, which a save taken after the script shows and a save taken before it does not (as for any party change between save and fight). Exp: 0x1CE only changes levels and exp, which the save shows. The when lists every header above; Roark (246, header 47) is on none of them"
when = { map_header = [104, 113, 130, 148, 158, 160, 172, 216, 257, 293, 301, 302, 306, 321, 348, 373, 384, 415, 440, 514] }

