[project]
name = "nuzline"
version = "0.0.1"
description = "High-EV line finder for single-player nuzlocke battles in Pokemon Platinum"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flatbuffers>=25.12.19",
    "jax[cpu]>=0.4.35",
    "numpy>=2.0",
]

[project.scripts]
nuzline = "nuzline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]
rom = [
    "ndspy>=4.1,<5",
    "openpyxl>=3.1,<4",
    "capstone>=5,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nuzline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: brute-force, loose, save- or ROM-bound tests; excluded from the fast tier"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
